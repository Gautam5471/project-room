name: rollback-prod

# Roll the production Workers back to recorded version ids. Use the ids from
# a deploy-prod run's pre-deploy artifact or summary, or from
# `wrangler versions list --env production` / `wrangler versions list`.
# Runbook: docs/DEPLOY-LANE.md. Schema migrations are forward-only: a code
# rollback never undoes a migration (docs/ROOM-DEPLOYMENT.md section 5).
# Targets must have readable immutable source/schema stamps and an exact-pair
# qualification receipt committed in this checkout (scripts/manual-rollback.mjs).
# UUIDs or equal schemas alone are not rollback qualification.
on:
  workflow_dispatch:
    inputs:
      prod_version_id:
        description: "project-room (canonical) version id to restore"
        required: true
        type: string
      entry_version_id:
        description: "project-room-staging (public entry) version id to restore; leave empty to keep the entry as is"
        required: false
        type: string
      reason:
        description: "Why (goes into the Cloudflare rollback message and the receipt)"
        required: true
        type: string
      compatibility_file:
        description: "Committed JSON receipt covering this exact current/target pair: old-code/new-data, retained runtime, and bindings (format in scripts/manual-rollback.mjs)"
        required: true
        type: string
      compatibility_reviewed:
        description: "I reviewed the receipt's exact-pair old-code/new-data, retained-runtime and binding evidence; equal schema alone is not proof"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROD_ORIGIN: https://room.trydemigod.com
  ENTRY_ORIGIN: https://www.getdasha.com/room
  RECEIPT_ROOM: muse-room
  WRANGLER_SEND_METRICS: "false"

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_ID: ${{ inputs.prod_version_id }}
      ENTRY_ID: ${{ inputs.entry_version_id }}
      REASON: ${{ inputs.reason }}
      COMPATIBILITY_FILE: ${{ inputs.compatibility_file }}
      COMPATIBILITY_REVIEWED: ${{ inputs.compatibility_reviewed }}
    steps:
      - name: Validate inputs and secrets
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=missing CLOUDFLARE_API_TOKEN::missing CLOUDFLARE_API_TOKEN: add the Actions secret. Nothing was rolled back."
            exit 1
          fi
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          [[ "$PROD_ID" =~ $uuid ]] || { echo "::error::prod_version_id is not a version uuid"; exit 1; }
          if [ -n "$ENTRY_ID" ]; then [[ "$ENTRY_ID" =~ $uuid ]] || { echo "::error::entry_version_id is not a version uuid"; exit 1; }; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --ignore-scripts --no-audit --no-fund
      - run: pnpm --dir cloudflare install --frozen-lockfile --ignore-scripts
      - name: Verify exact source, schema floor and compatibility before rollback
        id: pre
        run: node scripts/manual-rollback.mjs preflight "$RUNNER_TEMP/rollback-preflight.json"
      - name: Roll back
        id: rollback
        run: node scripts/manual-rollback.mjs execute "$RUNNER_TEMP/rollback-preflight.json"
      - name: Read back restored versions and both doors
        id: readback
        shell: bash
        working-directory: cloudflare
        run: |
          set -euo pipefail
          sleep 15
          prod_status="$(pnpm exec wrangler deployments status --env production --json)"
          entry_status=null
          if [ -n "$ENTRY_ID" ]; then
            entry_status="$(pnpm exec wrangler deployments status --json)"
          fi
          printf '{"prod":%s,"entry":%s}\n' "$prod_status" "$entry_status" |
            node ../scripts/rollback-readback.mjs --prod-id "$PROD_ID" --entry-id "$ENTRY_ID" --origin "$PROD_ORIGIN" --entry "$ENTRY_ORIGIN" --preflight "$RUNNER_TEMP/rollback-preflight.json" |
            tee "$RUNNER_TEMP/rollback-readback.json"
      - name: Smoke health, ready, legal pages
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prod-deploy-smoke.mjs --origin "$PROD_ORIGIN" --entry "$ENTRY_ORIGIN"
      - name: Receipt to muse-room
        if: always()
        continue-on-error: true
        env:
          ROOM_RECEIPT_TOKEN: ${{ secrets.ROOM_RECEIPT_TOKEN }}
          OUTCOME: ${{ job.status }}
          READBACK_OUTCOME: ${{ steps.readback.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.pre.outcome }}
          PROD_WAS: ${{ steps.pre.outputs.prod }}
          ENTRY_WAS: ${{ steps.pre.outputs.entry }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ROOM_RECEIPT_TOKEN" ]; then echo "ROOM_RECEIPT_TOKEN not set; no receipt posted."; exit 0; fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const e = process.env, s = v => (v || "?").slice(0, 8);
            let readback = "readback not verified";
            if (e.READBACK_OUTCOME === "success") {
              try {
                const report = JSON.parse(readFileSync(`${e.RUNNER_TEMP}/rollback-readback.json`, "utf8"));
                if (report.ok === true) readback = `verified readback ${JSON.stringify(report)}`;
              } catch {}
            }
            const entry = e.ENTRY_ID ? `entry ${s(e.ENTRY_ID)} (was ${s(e.ENTRY_WAS)})` : "entry unchanged";
            const admission = e.PREFLIGHT_OUTCOME === "success" ? "manual compatibility review recorded" : "preflight not passed; no rollback started";
            const body = `PROD ROLLBACK · prod ${s(e.PROD_ID)} (was ${s(e.PROD_WAS)}) · ${entry} · ${admission} · smoke ${e.OUTCOME === "success" ? "ok" : e.OUTCOME} · ${readback} · ${e.REASON.slice(0, 200)} · ${e.RUN_URL}`;
            const command = { id: crypto.randomUUID(), type: "message.posted", data: { messageId: crypto.randomUUID(), body } };
            const res = await fetch(`${e.PROD_ORIGIN}/api/rooms/${e.RECEIPT_ROOM}/commands`, {
              method: "POST",
              headers: { authorization: `Bearer ${e.ROOM_RECEIPT_TOKEN}`, "content-type": "application/json", origin: e.PROD_ORIGIN,
                "user-agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36 project-room-rollback-prod" },
              body: JSON.stringify(command),
            });
            console.log(`receipt: HTTP ${res.status}`);
            if (!res.ok) process.exit(1);
          '
